<section class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold" style="color:#495057;">
            Elegidos especialmente para ti
        </h5>
        <a href="/catalogo" style="color:#2b78e4; font-size:0.85rem; text-decoration:none; font-weight:600;">
            Ver más productos
        </a>
    </div>

    <div id="productCarousel" class="carousel slide position-relative px-4" data-bs-ride="false">

        <div class="carousel-inner">

            <div *ngFor="let chunk of chunkedProducts; let i = index" class="carousel-item" [class.active]="i === 0">

                <div class="row g-3">
                    <div class="col-6 col-md-3" *ngFor="let producto of chunk">
                        <div class="producto-card h-100 d-flex flex-column">
                            <div class="producto-imagen-container">
                                <img [src]="producto.imagen" [alt]="producto.nombre" class="producto-img">
                            </div>
                            <div class="producto-info d-flex flex-column flex-grow-1">
                                <span class="producto-marca">FARMACODE</span>
                                <h3 class="producto-nombre">{{ producto.nombre }}</h3>
                                <p class="producto-unidad">{{ producto.descripcion }}</p>
                                <div class="producto-precios mt-auto">
                                    <span class="precio-actual">S/ {{ producto.precio | number:'1.2-2' }}</span>
                                    <span class="precio-regular">Precio regular: S/ {{ producto.precio * 1.2 | number:'1.2-2' }}</span>
                                </div>
                                <button type="button" class="btn-agregar w-100" (click)="agregarProducto(producto)">
                                    Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev"
            style="left:-1.5rem; width:2rem;">
            <span class="carousel-control-prev-icon"
                style="filter:invert(1) sepia(1) saturate(5) hue-rotate(190deg);"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next"
            style="right:-1.5rem; width:2rem;">
            <span class="carousel-control-next-icon"
                style="filter:invert(1) sepia(1) saturate(5) hue-rotate(190deg);"></span>
        </button>

    </div>
</section>
